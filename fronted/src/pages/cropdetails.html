<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crop Details - AgriFlow</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <div class="logo">
            AgriFlow
        </div>

        <nav>
            <a href="addcrop.html">Add Crop</a>
            <a href="myproduce.html">My Produce</a>
        </nav>

    </header>


    <!-- MAIN -->
    <main class="container">

        <div class="page-header">

            <h1>Crop Details</h1>

            <p>
                View your crop information
            </p>

        </div>


        <!-- DETAILS -->
        <div
            class="card"
            id="cropDetails">

            <h2 id="cropName">
                Crop Name
            </h2>


            <div class="detail-row">

                <span>
                    Category
                </span>

                <strong id="cropCategory">
                    -
                </strong>

            </div>


            <div class="detail-row">

                <span>
                    Quantity
                </span>

                <strong id="cropQuantity">
                    -
                </strong>

            </div>


            <div class="detail-row">

                <span>
                    Unit
                </span>

                <strong id="cropUnit">
                    -
                </strong>

            </div>


            <a
                href="myproduce.html"
                class="btn secondary-btn">
                Back to My Produce
            </a>

        </div>

    </main>


    <script src="../js/script.js"></script>

</body>

</html>

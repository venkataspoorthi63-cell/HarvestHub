<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Crop - AgriFlow</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <div class="logo">
            AgriFlow
        </div>

        <nav>
            <a href="addcrop.html">Add Crop</a>
            <a href="myproduce.html">My Produce</a>
        </nav>

    </header>


    <!-- MAIN -->
    <main class="container">

        <div class="page-header">
            <h1>Add Crop</h1>
            <p>Enter your crop details</p>
        </div>


        <!-- FORM -->
        <div class="card">

            <form id="addCropForm">

                <!-- Crop Name -->
                <div class="form-group">

                    <label for="cropName">
                        Crop Name
                    </label>

                    <div class="input-with-voice">

                        <input
                            type="text"
                            id="cropName"
                            placeholder="Example: Rice"
                            required
                        >

                        <button
                            type="button"
                            class="voice-btn"
                            onclick="startVoiceInput('cropName')">
                            🎤
                        </button>

                    </div>

                </div>


                <!-- Category -->
                <div class="form-group">

    <label for="category">
        Category
    </label>

    <div class="input-with-voice">

        <select id="category" required>

            <option value="">
                Select Category
            </option>

            <option value="Cereals">
                Cereals
            </option>

            <option value="Pulses">
                Pulses
            </option>

            <option value="Vegetables">
                Vegetables
            </option>

            <option value="Fruits">
                Fruits
            </option>

            <option value="Oilseeds">
                Oilseeds
            </option>

            <option value="Spices">
                Spices
            </option>

            <option value="Commercial Crops">
                Commercial Crops
            </option>

            <option value="Other">
                Other
            </option>

        </select>

        <button
            type="button"
            class="voice-btn"
            onclick="startVoiceInput('category')">
            🎤
        </button>

    </div>

</div>


                <!-- Quantity -->
                <div class="form-group">

                    <label for="quantity">
                        Quantity
                    </label>

                    <div class="input-with-voice">

                        <input
                            type="number"
                            id="quantity"
                            placeholder="Example: 100"
                            min="1"
                            required
                        >

                        <button
                            type="button"
                            class="voice-btn"
                            onclick="startVoiceInput('quantity')">
                            🎤
                        </button>

                    </div>

                </div>


                <!-- Unit -->
                <div class="form-group">

    <label for="unit">
        Unit
    </label>

    <div class="input-with-voice">

        <select id="unit" required>

            <option value="">
                Select Unit
            </option>

            <option value="kg">
                Kilograms (kg)
            </option>

            <option value="quintal">
                Quintal
            </option>

            <option value="ton">
                Ton
            </option>

            <option value="bags">
                Bags
            </option>

            <option value="litres">
                Litres
            </option>

            <option value="pieces">
                Pieces
            </option>

        </select>

        <button
            type="button"
            class="voice-btn"
            onclick="startVoiceInput('unit')">
            🎤
        </button>

    </div>

</div>
              


                <!-- SUBMIT -->
                <button
                    type="submit"
                    class="btn primary-btn">
                    Add Crop
                </button>

            </form>

        </div>

    </main>


    <script src="../js/script.js"></script>

</body>

</html>
